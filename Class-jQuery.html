<!DOCTYPE html>
<html lang="en">
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Mouse Events</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .box {
            width: 200px;
            height: 200px;
            background-color: lightblue;
            margin: 20px;
            display: inline-block;
            text-align: center;
            line-height: 200px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>jQuery Mouse Events Example</h2>
    <div class="box">Hover or Click Me</div>
    <script>
            // Mouseover event
                $('.box').mouseover(function() {
                    $(this).css('background-color', 'lightcoral');
                    $(this).text('Mouse Over!');
                });

        </script>
    </body>
</html>
